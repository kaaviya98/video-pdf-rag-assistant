[project]
name = "learnlens-standalone"
version = "1.0.0"
description = "Standalone PDF and video RAG chat with Django ORM and FastAPI"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.1,<5.2", "django-environ>=0.11", "django-model-utils>=4.5",
  "django-safedelete>=1.4", "django-simple-history>=3.7", "django-multitenant>=4.1", "psycopg[binary]>=3.2",
  "fastapi[standard]>=0.115", "pydantic>=2.11", "marker-pdf>=1.7.3",
  "chonkie>=1.0.8", "htmltabletomd>=1.0", "beautifulsoup4>=4.13",
  "langchain>=0.3.26", "langchain-openai>=0.3.27",
  "langchain-community>=0.3.27", "langchain-core>=0.3.68",
  "langchain-redis>=0.2.2", "langchain-weaviate>=0.0.5", "langchain-google-genai>=2.0",
  "weaviate-client>=4.9,<5", "webvtt-py>=0.5.1", "shortuuid>=1.0.13", "numpy>=1.26",
  "redis>=5", "celery>=5.5", "requests>=2.32", "boto3>=1.36",
  "cryptography>=45", "sentry-sdk>=2.20"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "config"]
